name: representation_theory
display_name: 表示论

context_hints:
  - 注意基域的特征对表示论的影响（char 0 半单性 vs 模表示论）
  - 区分有限群、李群、李代数、代数群的表示
  - 注意表示的类型（不可约、半单、不可分解）
  - 范畴化 (categorification) 语言可能隐含复杂的同调代数背景

common_techniques:
  - name: 特征标理论 (Character Theory)
    description: 通过特征标分解和正交关系分析表示
  - name: 诱导和限制 (Induction/Restriction)
    description: 在子群和群之间传递表示信息
  - name: 最高权理论 (Highest Weight Theory)
    description: 半单李代数有限维表示的分类
  - name: 几何表示论
    description: 通过代数几何（旗簇、Springer 分解等）构造和研究表示
  - name: 范畴化 (Categorification)
    description: 将代数结构提升到范畴层面

critical_assumptions:
  - "半单性（Maschke 定理）需要特征不整除群阶"
  - "完全可约性在模表示论中失效"
  - "Weyl 特征标公式需要半单李代数 + char 0"
  - "Kazhdan-Lusztig 理论的适用范围依赖于具体的 Coxeter 系统"

standard_notation:
  "\\mathrm{Rep}(G)": 表示范畴
  "\\mathrm{Ind}_H^G": 诱导函子
  "\\mathrm{Res}_H^G": 限制函子
  "\\chi_V": 特征标
  "\\mathfrak{g}": 李代数
  "U(\\mathfrak{g})": 泛包络代数
